<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Mobile footer regression</title>
<body><pre id="result">Running…</pre><iframe title="Flowtree footer test" src="/offline.local.html" style="border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const result = document.querySelector('#result');
const checks = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); checks.push(message); };
await new Promise(resolve => frame.addEventListener('load', resolve));
try {
  for (const [width, height] of [[320,740],[360,800],[390,844],[430,932],[568,320],[740,360],[768,1024],[1366,768],[1920,1080]]) {
    frame.style.width = `${width}px`; frame.style.height = `${height}px`;
    await new Promise(resolve => setTimeout(resolve, 150));
    const doc = frame.contentDocument;
    const nav = doc.querySelector('.mobile-bottom-nav');
    const style = frame.contentWindow.getComputedStyle(nav);
    if (width > 760) { assert(style.display === 'none', `${width}: desktop dock hidden`); continue; }
    const bounds = nav.getBoundingClientRect();
    assert(bounds.left >= 12 && bounds.right <= width - 12 && bounds.bottom <= height - 20, `${width}: dock inset from screen edges`);
    assert([...nav.querySelectorAll('button')].every(button => { const r = button.getBoundingClientRect(); return r.width >= 44 && r.height >= 44 && r.left >= bounds.left && r.right <= bounds.right; }), `${width}: five usable targets fit`);
    const labelTops = [...nav.querySelectorAll('button > :last-child')].map(label => label.getBoundingClientRect().top);
    assert(Math.max(...labelTops) - Math.min(...labelTops) < 1, `${width}: all five labels share a baseline`);
    const canvas = doc.querySelector('.energy-viewport');
    assert(Math.abs(canvas.getBoundingClientRect().bottom - height) <= 1, `${width}: content extends behind glass dock`);
    assert(parseFloat(frame.contentWindow.getComputedStyle(canvas).paddingBottom) >= height - bounds.top, `${width}: scroll-end padding clears dock`);
    canvas.scrollTop = canvas.scrollHeight;
    const lastCard = [...canvas.querySelectorAll('.mobile-tree-card')].at(-1);
    if (lastCard) assert(lastCard.getBoundingClientRect().bottom <= bounds.top, `${width}: last card scrolls fully above dock`);
    canvas.scrollTop = 0;
    nav.querySelector('[aria-controls="mobile-more-menu"]').click();
    await new Promise(resolve => setTimeout(resolve, 50));
    const menuElement = doc.querySelector('.mobile-more-menu');
    assert(!menuElement.querySelector('.mobile-more-account') && !/Sign in|Log out|switch account/.test(menuElement.textContent), `${width}: More has no duplicate account section`);
    assert(!/Use (light|dark) mode/.test(menuElement.textContent), `${width}: theme control is not duplicated in More`);
    const menu = menuElement.getBoundingClientRect();
    assert(nav.querySelectorAll('.is-active').length === 1 && nav.querySelector('[aria-controls="mobile-more-menu"]').classList.contains('is-active'), `${width}: only More is highlighted while open`);
    assert(menu.top >= 0 && menu.bottom <= bounds.top, `${width}: More menu clears dock`);
    nav.querySelector('[aria-controls="mobile-more-menu"]').click();
    await new Promise(resolve => setTimeout(resolve, 50));
    assert(nav.querySelectorAll('.is-active').length === 1 && nav.querySelector('button').classList.contains('is-active'), `${width}: Home highlight returns after closing More`);
    nav.querySelector('[aria-controls="account-menu"]').click();
    await new Promise(resolve => setTimeout(resolve, 50));
    assert(/Use (light|dark) mode/.test(doc.querySelector('.account-menu-theme')?.textContent || ''), `${width}: Account contains theme control`);
    nav.querySelector('[aria-controls="account-menu"]').click();
    await new Promise(resolve => setTimeout(resolve, 50));
    if (width === 390) {
      // Synthetic pointer events cannot acquire a native pointer capture.
      nav.setPointerCapture = () => {};
      nav.hasPointerCapture = () => false;
      const buttons = [...nav.children];
      const point = index => { const r = buttons[index].getBoundingClientRect(); return { clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }; };
      const pointer = (type, index) => nav.dispatchEvent(new frame.contentWindow.PointerEvent(type, { bubbles: true, pointerId: 1, isPrimary: true, button: 0, ...point(index) }));
      pointer('pointerdown', 0); pointer('pointermove', 2);
      await new Promise(resolve => setTimeout(resolve, 50));
      assert(buttons[2].classList.contains('is-active') && buttons[0].getAttribute('aria-current') === 'page', 'Drag previews destination without navigating');
      pointer('pointerup', 2);
      await new Promise(resolve => setTimeout(resolve, 50));
      assert(buttons[2].getAttribute('aria-current') === 'page', 'Release selects Loans');
      pointer('pointerdown', 2); pointer('pointermove', 3); pointer('pointercancel', 3);
      await new Promise(resolve => setTimeout(resolve, 50));
      assert(!doc.querySelector('.mobile-more-menu') && buttons[2].classList.contains('is-active'), 'Cancelled drag restores current section');
      buttons[0].click();
      await new Promise(resolve => setTimeout(resolve, 50));
      delete nav.setPointerCapture; delete nav.hasPointerCapture;
    }
    doc.documentElement.style.setProperty('--mobile-safe-bottom', '34px');
    assert(nav.getBoundingClientRect().bottom <= height - 54, `${width}: home indicator clearance`);
    doc.documentElement.style.removeProperty('--mobile-safe-bottom');
    if (width >= 568) {
      doc.documentElement.style.setProperty('--mobile-safe-left', '44px');
      doc.documentElement.style.setProperty('--mobile-safe-right', '44px');
      const safeBounds = nav.getBoundingClientRect();
      assert(safeBounds.left >= 60 && safeBounds.right <= width - 60, `${width}: landscape side safe areas plus gutters`);
      doc.documentElement.style.removeProperty('--mobile-safe-left');
      doc.documentElement.style.removeProperty('--mobile-safe-right');
    }
  }
  document.body.dataset.result = 'pass'; result.textContent = `PASS\n${checks.join('\n')}`;
} catch (error) { document.body.dataset.result = 'fail'; result.textContent = `FAIL: ${error.message}\n${checks.join('\n')}`; }
</script></body></html>
