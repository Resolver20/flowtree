<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Mobile footer regression</title>
<body><pre id="result">Running…</pre><iframe title="Flowtree footer test" src="/offline.local.html" style="border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const result = document.querySelector('#result');
const checks = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); checks.push(message); };
await new Promise(resolve => frame.addEventListener('load', resolve));
try {
  for (const [width, height] of [[320,740],[390,844],[568,320],[768,1024],[1366,768],[1920,1080]]) {
    frame.style.width = `${width}px`; frame.style.height = `${height}px`;
    await new Promise(resolve => setTimeout(resolve, 150));
    const doc = frame.contentDocument;
    const nav = doc.querySelector('.mobile-bottom-nav');
    const style = frame.contentWindow.getComputedStyle(nav);
    if (width > 760) { assert(style.display === 'none', `${width}: desktop dock hidden`); continue; }
    const bounds = nav.getBoundingClientRect();
    assert(bounds.left >= 12 && bounds.right <= width - 12 && bounds.bottom <= height - 10, `${width}: dock inset from screen edges`);
    assert([...nav.querySelectorAll('button')].every(button => { const r = button.getBoundingClientRect(); return r.width >= 44 && r.height >= 44 && r.left >= bounds.left && r.right <= bounds.right; }), `${width}: five usable targets fit`);
    assert(doc.querySelector('.energy-viewport').getBoundingClientRect().bottom <= bounds.top, `${width}: content clears dock`);
    nav.querySelector('[aria-controls="mobile-more-menu"]').click();
    await new Promise(resolve => setTimeout(resolve, 50));
    const menu = doc.querySelector('.mobile-more-menu').getBoundingClientRect();
    assert(menu.top >= 0 && menu.bottom <= bounds.top, `${width}: More menu clears dock`);
    nav.querySelector('[aria-controls="mobile-more-menu"]').click();
    doc.documentElement.style.setProperty('--mobile-safe-bottom', '34px');
    assert(nav.getBoundingClientRect().bottom <= height - 34, `${width}: home indicator clearance`);
    doc.documentElement.style.removeProperty('--mobile-safe-bottom');
  }
  document.body.dataset.result = 'pass'; result.textContent = `PASS\n${checks.join('\n')}`;
} catch (error) { document.body.dataset.result = 'fail'; result.textContent = `FAIL: ${error.message}\n${checks.join('\n')}`; }
</script></body></html>
