<!doctype html><html lang="en"><meta charset="utf-8"><title>Sinking expansion regression</title><body>
<pre id="result">Running…</pre><iframe title="Sinking funds test" src="/offline.local.html" style="border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const wait = () => new Promise(resolve => setTimeout(resolve, 100));
await new Promise(resolve => frame.addEventListener('load', resolve));
const checks = [];
try {
  for (let i = 0; i < 100 && !frame.contentDocument.querySelector('.sidebar-nav'); i++) await wait();
  const doc = frame.contentDocument;
  doc.querySelector('.sidebar-nav [aria-label="Sinking funds"]').click();
  for (const [width, height] of [[320,740],[390,844],[568,320],[768,1024],[1366,768],[1920,1080]]) {
    frame.style.width = `${width}px`; frame.style.height = `${height}px`; await wait();
    const sections = [...doc.querySelectorAll('[data-tree-path]')].filter(el => !el.dataset.treePath.includes('/') && el.querySelector(':scope > .mobile-tree-node-row > button.mobile-tree-card, :scope > button.amount-node'));
    if (sections.length < 2) throw Error('Fixture requires two expandable sinking sections');
    const keys = sections.slice(0,2).map(el => el.dataset.treePath);
    const get = key => doc.querySelector(`[data-tree-path="${key}"]`);
    const toggle = async key => { get(key).querySelector(':scope > .mobile-tree-node-row > button.mobile-tree-card, :scope > button.amount-node').click(); await wait(); };
    for (const key of keys) if (get(key).classList.contains('is-expanded')) await toggle(key);
    await toggle(keys[0]); await toggle(keys[1]);
    if (!keys.every(key => get(key).classList.contains('is-expanded'))) throw Error(`${width}: opening sibling closed earlier section`);
    await toggle(keys[1]);
    if (!get(keys[0]).classList.contains('is-expanded')) throw Error(`${width}: collapsing sibling closed earlier section`);
    checks.push(`${width}×${height}: independent expansion/collapse passed`);
  }
  document.body.dataset.result = 'pass'; document.querySelector('#result').textContent = checks.join('\n');
} catch (error) { document.body.dataset.result = 'fail'; document.querySelector('#result').textContent = error.message; }
</script></body></html>
