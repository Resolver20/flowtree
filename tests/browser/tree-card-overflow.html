<!doctype html><html><meta charset="utf-8"><title>Tree card overflow checks</title>
<pre id="results">Running…</pre><script type="module">
const frame = document.createElement('iframe');
frame.style.cssText = 'height:720px';
document.body.append(frame);
let checks = 0;
const check = (ok, message) => { if (!ok) throw Error(message); checks++; };
try {
  for (const theme of ['light', 'dark']) for (const width of [320, 568, 768, 1366, 1920]) {
    frame.style.width = `${width}px`;
    const loaded = new Promise(resolve => frame.onload = resolve);
    frame.src = `./tree-card-overflow.fixture.html?theme=${theme}&width=${width}`;
    await loaded;
    const d = frame.contentDocument;
    for (let i = 0; i < 100 && !d.querySelector('.amount-node'); i++) await new Promise(r => setTimeout(r, 20));
    await d.fonts.ready;
    const cards = d.querySelectorAll('.amount-node');
    check(cards.length === 7, 'all sample cards mount');
    for (const card of cards) {
      const amount = card.querySelector('.amount-number');
      const line = card.querySelector('.node-progress')?.getBoundingClientRect();
      const name = card.querySelector('strong');
      const badge = card.querySelector('.inactive-marker, .monthly-plan-share');
      check(amount.scrollWidth <= amount.clientWidth, 'full amount fits');
      check(amount.getBoundingClientRect().height < 20, 'amount stays on one line');
      check(!card.querySelector('.target-meta'), 'no cramped target summary');
      if (line) check(amount.getBoundingClientRect().bottom <= line.top, 'amount above progress line');
      check(Boolean(line) === Boolean(card.querySelector('.inactive-marker')), 'only dated yearly sample cards show a line');
      check(name.getBoundingClientRect().right <= badge.getBoundingClientRect().left, 'name and badge do not overlap');
      check(badge.getBoundingClientRect().bottom <= amount.getBoundingClientRect().top, 'badge does not overlap amount');
      if (['Mobile recharge', 'Car insurance', 'Tax Obligations'].includes(name.textContent)) {
        check(name.scrollWidth <= name.clientWidth, `${name.textContent} fits without truncation`);
      }
      if (card.querySelector('.inactive-marker')) check(!card.querySelector('.monthly-plan-share'), 'paused replaces redundant share');
    }
  }
  document.querySelector('#results').textContent = `PASS ${checks} checks`;
} catch (error) {
  document.querySelector('#results').textContent = `FAIL ${error.message}`;
  throw error;
}
</script></html>
