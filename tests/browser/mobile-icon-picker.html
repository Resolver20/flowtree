<!doctype html><html><meta charset="utf-8"><title>Icon dropdown checks</title><pre id="results">Running…</pre><script type="module">
const results = document.querySelector('#results');
let checks = 0;
try {
  for (const theme of ['light', 'dark']) for (const width of [320, 390, 568, 760, 768, 1366, 1920]) for (const compact of [false, true]) {
    const frame = document.createElement('iframe');
    frame.style.cssText = `width:${width}px;height:420px;border:0`;
    frame.src = `./mobile-icon-picker.fixture.html?theme=${theme}${compact ? '&compact' : ''}`;
    document.body.append(frame);
    await new Promise(resolve => frame.onload = resolve);
    const d = frame.contentDocument;
    for (let i = 0; i < 100 && !d.querySelector('[role=combobox]'); i++) await new Promise(r => setTimeout(r, 20));
    await d.fonts.ready;
    const wait = () => new Promise(r => setTimeout(r, 30));
    function check(ok, message) { if (!ok) throw Error(`${theme}/${width}/${compact}: ${message}`); checks++; }
    const search = d.querySelector('[role=combobox]');
    check(Boolean(search), 'search field present');
    check(search.value === 'Savings', 'saved icon label shown');
    search.focus(); await wait();
    const options = [...d.querySelectorAll('[role=option]')];
    check(options.length > 50, 'all icons available on focus');
    check(options.every(o => o.querySelector('.material-symbols-rounded') && o.querySelector('.icon-picker-label')), 'each option has an icon and text');
    for (let i = 1; i < options.length; i++) check(options[i].getBoundingClientRect().top >= options[i-1].getBoundingClientRect().bottom - 1, 'single column rows');
    check(options.every(o => o.scrollWidth <= o.clientWidth), 'option contents fit');
    check(options.every(o => o.querySelector('.icon-picker-label').getBoundingClientRect().width >= 80), 'label has room for complete words');
    check(d.querySelector('.icon-picker-list').scrollWidth <= d.querySelector('.icon-picker-list').clientWidth, 'dropdown has no horizontal scroll');
    async function type(text) {
      search.focus();
      Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLInputElement.prototype, 'value').set.call(search, text);
      search.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true })); await wait();
    }
    await type('insu');
    check(d.querySelectorAll('[role=option]').length > 1, 'partial matches');
    check(d.querySelector('output').textContent === 'savings', 'typing preserves saved icon');
    await type('no-such-icon');
    check(d.querySelectorAll('[role=option]').length === 1 && d.querySelector('[role=option]').getAttribute('aria-label') === 'no-such-icon', 'fallback keeps typed text');
    check(d.querySelector('output').textContent === 'savings', 'unmatched search does not change selection');
    d.querySelector('[role=option]').click(); await wait();
    check(search.value === 'no-such-icon', 'fallback selection keeps typed text');
    check(d.querySelector('.icon-select > .material-symbols-rounded').textContent === 'savings', 'fallback uses savings icon');
    search.blur(); await wait();
    check(search.value === 'no-such-icon', 'blur preserves custom text');
    await type('bank');
    search.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); await wait();
    check(d.querySelector('output').textContent === 'account_balance', 'Enter selects single result');
    check(search.value === 'Bank', 'selected name replaces query');
    check(!d.querySelector('.icon-picker-panel'), 'selection closes dropdown');
    await type('fit');
    d.querySelector('[role=option][aria-label="Fitness"]').click(); await wait();
    check(d.querySelector('output').textContent === 'fitness_center' && search.value === 'Fitness', 'click updates icon and field text');
    check(d.querySelector('.icon-select > .material-symbols-rounded').textContent === 'fitness_center', 'preview updates');
    await type('insu');
    search.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true })); await wait();
    check(!!d.getElementById(search.getAttribute('aria-activedescendant')), 'arrow key focuses a match');
    search.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait();
    check(search.value === 'Fitness' && !d.querySelector('.icon-picker-panel'), 'Escape restores selected name');
    await type('home'); search.blur(); await wait();
    check(!d.querySelector('.icon-picker-panel'), 'leaving field dismisses dropdown');
    check(d.documentElement.scrollWidth <= width, 'no page overflow');
    frame.remove();
  }
  const missingFrame = document.createElement('iframe');
  missingFrame.src = './mobile-icon-picker.fixture.html?missing';
  document.body.append(missingFrame);
  await new Promise(resolve => missingFrame.onload = resolve);
  const missingDoc = missingFrame.contentDocument;
  for (let i = 0; i < 100 && !missingDoc.querySelector('[role=combobox]'); i++) await new Promise(r => setTimeout(r, 20));
  if (missingDoc.querySelector('[role=combobox]').value !== '' || missingDoc.querySelector('.icon-select > .material-symbols-rounded').textContent !== 'savings') throw Error('missing icon uses Savings symbol without inserting text');
  checks++;
  missingFrame.remove();
  results.textContent = `PASS ${checks} checks`;
} catch (error) { results.textContent = `FAIL ${error.message}`; throw error; }
</script></html>
