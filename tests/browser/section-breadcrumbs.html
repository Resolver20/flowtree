<!doctype html><html lang="en"><meta charset="utf-8"><title>Section breadcrumb regression</title><body>
<pre id="result">Running…</pre><iframe title="Section navigation test" src="/offline.local.html" style="width:1100px;height:768px;border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
await new Promise(resolve => frame.addEventListener('load', resolve));
for (let attempt = 0; attempt < 100 && !frame.contentDocument.querySelector('.sidebar-nav'); attempt++) await new Promise(resolve => setTimeout(resolve, 50));
const errors = [];
for (const name of ['Sinking funds', 'Loans', 'Life goals', 'Recurring payments', 'Investments', 'General ledger', 'Home']) {
  frame.contentDocument.querySelector(`.sidebar-nav button[aria-label="${name}"]`).click();
  await new Promise(resolve => setTimeout(resolve, 50));
  if (frame.contentDocument.querySelector('.energy-breadcrumbs')) errors.push(`${name}: unexpected Whole tree breadcrumb`);
}
document.body.dataset.result = errors.length ? 'fail' : 'pass';
document.querySelector('#result').textContent = errors.length ? errors.join('\n') : 'PASS: all six dedicated screens and Home root have no Whole tree breadcrumb';
</script></body></html>
