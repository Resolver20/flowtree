<!doctype html><html lang="en"><meta charset="utf-8"><title>Loan schedule layout regression</title><body>
<pre id="result">Running…</pre><iframe title="Loan layout test" src="/offline.local.html" style="border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const wait = () => new Promise(resolve => setTimeout(resolve, 100));
await new Promise(resolve => frame.addEventListener('load', resolve));
const checks = [];
try {
  for (let i=0;i<100 && !frame.contentDocument.querySelector('.sidebar-nav');i++) await wait();
  const doc = frame.contentDocument;
  doc.querySelector('.sidebar-nav [aria-label="Loans"]').click(); await wait();
  doc.querySelector('.loan-list button').click(); await wait();
  for (const [width,height] of [[320,740],[390,844],[568,320],[768,1024],[1366,768],[1920,1080]]) {
    frame.style.width = `${width}px`; frame.style.height = `${height}px`; await wait();
    const page = doc.querySelector('.loans-view');
    const details = doc.querySelector('.loan-details');
    const toggle = doc.querySelector('.loan-schedule-toggle');
    toggle.scrollIntoView({block:'center'}); await wait();
    const before = details.getBoundingClientRect(); const scroll = page.scrollTop;
    toggle.click(); await wait();
    const after = details.getBoundingClientRect();
    if (Math.abs(before.width-after.width)>1 || Math.abs(before.x-after.x)>1) throw Error(`${width}: opening changed card width/position`);
    if (Math.abs(page.scrollTop-scroll)>1) throw Error(`${width}: opening moved page scroll position`);
    if (page.scrollWidth>page.clientWidth+1) throw Error(`${width}: page overflow`);
    const table = doc.querySelector('.loan-table-wrap');
    if (table.getBoundingClientRect().right>after.right || table.clientHeight>390) throw Error(`${width}: unbounded table`);
    table.scrollLeft=table.scrollWidth;table.scrollTop=200;await wait();
    if (Math.abs(page.scrollTop-scroll)>1 || page.scrollLeft!==0) throw Error(`${width}: table scroll moved outer page`);
    toggle.click();await wait();
    if (Math.abs(details.getBoundingClientRect().width-before.width)>1) throw Error(`${width}: closing changed card width`);
    checks.push(`${width}×${height}: stable card and page, contained schedule scrolling`);
  }
  document.body.dataset.result='pass';document.querySelector('#result').textContent=checks.join('\n');
} catch(error) {document.body.dataset.result='fail';document.querySelector('#result').textContent=error.message;}
</script></body></html>
