<!doctype html><html lang="en"><meta charset="utf-8"><title>All section boxes regression</title><pre id="result">Running…</pre><iframe title="Section boxes" style="border:0"></iframe><script type="module">
const frame=document.querySelector('iframe');frame.src='/tests/browser/responsive-boxes.fixture.html';
const wait=()=>new Promise(resolve=>{const channel=new MessageChannel();channel.port1.onmessage=()=>{channel.port1.close();channel.port2.close();resolve()};channel.port2.postMessage(null)});let checks=0;const errors=[];
const check=(ok,message)=>{checks++;if(!ok)errors.push(message)};
const boxes='.loan-portfolio,.goal-portfolio,.loan-details,.goal-details,.ledger-details,.loan-editor,.goal-editor,.ledger-editor,.expense-editor,[class$="stat-grid"] > div,.loan-payment-summary > div,.goal-preview,.loan-draft-metrics > div,.payment-month-card,.recurring-day-list article';
function inspect(label){const doc=frame.contentDocument,page=doc.querySelector('.loans-view,.goals-view,.ledger-view,.recurring-view');
 check(!!page,`${label}: page mounts`);if(!page)return;
 check(page.scrollWidth<=page.clientWidth+1,`${label}: page overflow`);
 for(const el of page.querySelectorAll(boxes))check(el.scrollWidth<=el.clientWidth+1,`${label}: ${el.className||el.parentElement.className} overflow: ${el.textContent.slice(0,35)}`);
 for(const button of page.querySelectorAll('.goal-details-heading button,.goal-editor-heading button,.loan-details-heading button,.loan-editor-heading button,.ledger-details-heading button,.ledger-editor-heading button'))check(button.scrollWidth<=button.clientWidth+1&&button.getBoundingClientRect().height<=48,`${label}: action label is squeezed or overflows`);
}
try{
 await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
 for(const [width,height] of [[320,740],[390,844],[430,932],[568,320],[760,800],[768,1024],[1024,768],[1366,768],[1920,1080]]){
 frame.style.width=`${width}px`;frame.style.height=`${height}px`;
 for(const dark of [false,true])for(const screen of ['goals','loans','investments','ledger','recurring'])for(const long of [false,true]){
 const label=`${width}/${screen}/${dark?'dark':'light'}/${long?'unbroken':'words'}`;
 frame.contentWindow.renderCase({screen,dark,long});await wait();inspect(`${label}/overview`);
 const doc=frame.contentDocument;
 const item=doc.querySelector('.goal-portfolio-list button,.loan-portfolio-list button,.investment-list button');
 if(item){item.click();await wait();inspect(`${label}/detail`)}
 const edit=[...doc.querySelectorAll('.goal-details-heading button,.loan-details-heading button,.ledger-details-heading button')].find(el=>el.textContent.startsWith('Edit'));
 if(edit){edit.click();await wait();inspect(`${label}/edit`)}
 const add=doc.querySelector('.goal-add,.loan-add,.ledger-add');
 if(add){add.click();await wait();inspect(`${label}/add`)}
 }
 }
 document.body.dataset.result=errors.length?'fail':'pass';document.querySelector('#result').textContent=`${errors.length?'FAIL':'PASS'} (${checks} checks, ${errors.length} failures)\n${[...new Set(errors)].join('\n')}`;
}catch(error){document.body.dataset.result='fail';document.querySelector('#result').textContent=`FAIL: ${error.stack}`}
</script></html>
