<!doctype html><html lang="en"><meta charset="utf-8"><title>Monthly plan summary regression</title>
<body><pre id="result">Running…</pre><iframe title="Monthly plan card" style="border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
frame.src = '/tests/browser/monthly-plan-summary.fixture.html';
const wait = () => new Promise(resolve => setTimeout(resolve, 70));
const checks = [];
const assert = (condition, message) => { if (!condition) throw Error(message); checks.push(message); };
try {
  for(let i=0; i<100 && !frame.contentWindow.renderCase; i++) await wait();
  assert(Boolean(frame.contentWindow.renderCase), 'Fixture mounted');
  for (const width of [320,390,568,760]) {
    frame.style.width = `${width}px`; frame.style.height = '740px';
    for (const dark of [false,true]) for (const remaining of [10154,0,-4000,-12345678]) {
      frame.contentWindow.renderCase({deductions:12345678,remaining,dark}); await wait();
      const doc = frame.contentDocument, card = doc.querySelector('.mobile-plan-root');
      const title = card.querySelector('strong').getBoundingClientRect();
      const summary = card.querySelector('.mobile-plan-summary').getBoundingClientRect();
      const deductions = card.querySelector('.is-deductions'), available = card.querySelector('.is-remaining');
      const hub = card.querySelector('.mobile-plan-hub');
      const hubBox = hub.getBoundingClientRect(), rootBox = card.getBoundingClientRect();
      assert(Math.abs(hubBox.width - hubBox.height) < 1 && frame.contentWindow.getComputedStyle(hub).borderRadius === '50%', `${width}/${dark}/${remaining}: circular Monthly plan hub`);
      assert(Math.abs((hubBox.left + hubBox.right) / 2 - (rootBox.left + rootBox.right) / 2) < 1, `${width}/${dark}/${remaining}: hub centered above totals`);

      const format = n => `₹${new Intl.NumberFormat('en-IN',{maximumFractionDigits:0}).format(n)}`;
      assert(deductions.textContent === `Deductions ${format(12345678)}` && available.textContent === `Available ${format(remaining)}`, `${width}/${dark}/${remaining}: exact totals and signed remaining`);
      assert(summary.top >= title.bottom && summary.right <= card.getBoundingClientRect().right, `${width}/${dark}/${remaining}: summary below title and inside root`);
      assert(frame.contentWindow.getComputedStyle(deductions).color !== frame.contentWindow.getComputedStyle(available).color, `${width}/${dark}/${remaining}: distinct summary colors`);
      assert(card.scrollWidth <= card.clientWidth, `${width}/${dark}/${remaining}: card does not overflow`);
    }
    const incomeSources = [{id:'salary',name:'Salary',amount:50000},{id:'freelance',name:'Freelance income',amount:10000}];
    frame.contentWindow.renderCase({deductions:1,remaining:1,incomeSources}); await wait();
    const income = frame.contentDocument.querySelector('.mobile-tree-income');
    assert(income.querySelector('.mobile-income-root .mobile-income-source strong').textContent === 'Income', `${width}: Income parent remains with sources present`);
    assert(income.querySelector('.mobile-income-root .mobile-income-source small').textContent === '₹60,000 /mo', `${width}: parent shows combined income`);
    const children = [...income.querySelectorAll('.mobile-income-children .mobile-income-source')];
    assert(children.length === 2 && children[0].textContent.includes('Salary') && children[1].textContent.includes('Freelance income'), `${width}: sources are Income children`);
    assert(children.every(child => child.getBoundingClientRect().left > income.getBoundingClientRect().left && child.scrollWidth <= child.clientWidth), `${width}: child indentation without card overflow`);
    for (const child of children) {
      const info = child.parentElement.querySelector(':scope > .mobile-tree-manage');
      assert(!child.querySelector('button') && info && info.getBoundingClientRect().left >= child.getBoundingClientRect().right, `${width}: child Info sits outside its card`);
      assert(info.getBoundingClientRect().right <= income.getBoundingClientRect().right, `${width}: outside Info stays inside Income width`);
    }
    children[1].parentElement.querySelector(':scope > .mobile-tree-manage').click();
    assert(frame.contentDocument.body.dataset.managedSourceId === 'freelance', `${width}: child Info manages the correct source`);
    const toggle = income.querySelector('.mobile-income-root button.mobile-income-source');
    toggle.click(); await wait();
    assert(toggle.getAttribute('aria-expanded') === 'false' && income.querySelector('.mobile-income-children').hidden, `${width}: Income collapses its child group`);
    income.querySelector('.mobile-income-root .mobile-tree-manage').click(); await wait();
    assert(toggle.getAttribute('aria-expanded') === 'false', `${width}: Info does not toggle Income`);
    toggle.click(); await wait();
    assert(toggle.getAttribute('aria-expanded') === 'true' && !income.querySelector('.mobile-income-children').hidden, `${width}: Income expands its child group`);
    frame.contentWindow.renderCase({deductions:1,remaining:1,sinking:true}); await wait();
    assert(!frame.contentDocument.querySelector('.mobile-plan-summary'), `${width}: Sinking funds has no monthly summary`);
  }
  frame.contentWindow.renderIncomeOverview([{id:'salary',name:'Salary',amount:50000}]); await wait();
  const dialog = frame.contentDocument.querySelector('dialog');
  assert(!dialog.textContent.includes('Edit Salary'), 'Income overview has no source edit action');
  const add = [...dialog.querySelectorAll('button')].find(button => button.textContent === 'Add income source');
  assert(Boolean(add), 'Income overview contains Add income source');
  add.click();
  assert(frame.contentDocument.body.dataset.addRequested === 'yes', 'Add income source invokes the add workflow');
  document.body.dataset.result = 'pass'; document.querySelector('#result').textContent = `PASS (${checks.length} checks)\n${checks.join('\n')}`;
} catch(error) { document.body.dataset.result = 'fail'; document.querySelector('#result').textContent = `FAIL: ${error.message}`; }
</script></body></html>
